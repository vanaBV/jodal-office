<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>조달청 오피스</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="theme-color" content="#2F6BFF">
    <meta name="description" content="2026 조달청 AI 게임 공모전 출품작 · 신입 주무관이 되어 5일 동안 나라장터 업무를 처리하는 1인칭 오피스 게임">
    <meta property="og:title" content="조달청 오피스">
    <meta property="og:description" content="신입 주무관이 되어 5일 동안 나라장터 업무를 처리하는 1인칭 오피스 게임">
    <meta property="og:image" content="icon-512.png">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #BFE6FA; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #BFE6FA; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(#BFE6FA, #E8F6FF); color: #1B2A49; transition: opacity .4s; }
      #loading h1 { margin: 0; font-size: clamp(36px, 7vw, 72px); letter-spacing: -1px; }
      #loading p { margin: 0; font-size: clamp(14px, 2vw, 20px); color: #2F6BFF; font-weight: 700; }
      #bar { width: min(420px, 70vw); height: 12px; border-radius: 6px; background: #ffffffaa; overflow: hidden; }
      #fill { width: 0%; height: 100%; border-radius: 6px; background: #2F6BFF; transition: width .15s; }
      #msg { font-size: 15px; color: #6B7890; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>조달청 오피스</h1>
      <p>2026 조달청 AI 게임 공모전 출품작</p>
      <div id="bar"><div id="fill"></div></div>
      <div id="msg">불러오는 중…</div>
    </div>
    <script src="Build/OfficeWeb.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var msg = document.querySelector("#msg");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/OfficeWeb.data.unityweb",
        frameworkUrl: "Build/OfficeWeb.framework.js.unityweb",
        codeUrl: "Build/OfficeWeb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "JodalCity",
        productName: "조달청 오피스",
        productVersion: "0.1.0",
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.style.opacity = "0";
        setTimeout(function () { loading.style.display = "none"; }, 450);
        canvas.focus();
      }).catch(function (message) {
        msg.textContent = "게임을 불러오지 못했어요: " + message;
        msg.style.color = "#F04452";
      });
    </script>
  </body>
</html>
